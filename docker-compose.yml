# Local development dependencies.
#   docker compose up -d                  SQL Server + OpenTelemetry dashboard
#   docker compose --profile s3 up -d     ... plus MinIO (S3-compatible storage)
#   docker compose --profile pdf up -d    ... plus Gotenberg (HTML to PDF):  Documents__Pdf__Gotenberg__BaseUrl=http://localhost:3000/
#   docker compose --profile scan up -d   ... plus ClamAV (virus scanning):  FileScanning__ClamAv__Host=localhost
#   docker compose --profile app up -d    ... plus the app itself, built from src/Base.Web/Dockerfile
# Passwords here are for local containers only. Real credentials go in user-secrets or environment variables.
name: base

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Base_Dev_Password1!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  # Traces and metrics UI: http://localhost:18888 . The app exports to it when OTEL_EXPORTER_OTLP_ENDPOINT is set.
  otel-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

  # MinIO stopped publishing community images in late 2025; this pinned tag is the last widely used one.
  # Any S3-compatible store works (Cloudflare R2, AWS S3, Garage, SeaweedFS): point FileStorage:S3 at it.
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: base
      MINIO_ROOT_PASSWORD: base-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # HTML-to-PDF for document generation (MIT). Keep it on an internal network: it renders whatever HTML it is sent.
  gotenberg:
    profiles: ["pdf"]
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"

  # Virus scanning for uploads. Downloads signatures on first start, which takes a few minutes.
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Base.Web/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Base;User Id=sa;Password=Base_Dev_Password1!;TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-dashboard:18889"
    ports:
      - "8080:8080"

volumes:
  sqldata:
  miniodata:
