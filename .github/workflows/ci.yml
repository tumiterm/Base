name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore

      - name: Formatting and code style
        run: dotnet format --verify-no-changes --no-restore

      # Warnings are errors (Directory.Build.props); NuGet audit fails the build on vulnerable packages.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Migrations match the model
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Base.Infrastructure --startup-project src/Base.Infrastructure
          --configuration Release --no-build

      # Integration tests start SQL Server with Testcontainers (Docker is available on GitHub-hosted Linux runners).
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: ignore

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --file src/Base.Web/Dockerfile --tag base-web:ci .
