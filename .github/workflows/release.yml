name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with that version's changelog section.
# The tag must match the version in Directory.Build.props and docs/changelog.md must have a section for it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag, the version and the changelog agree
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild src/Base.Domain/Base.Domain.csproj -getProperty:Version)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match the version in Directory.Build.props ($version)."
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' docs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::docs/changelog.md has no section for $version."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
